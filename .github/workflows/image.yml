name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11' # the image's python3 (Debian bookworm)
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: No credentials in the repository
        run: SCAN_REPO=1 python3 scripts/scan_secrets.py .

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # Build amd64 into the local daemon first; push only after the smoke test passes.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smoke:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/smoke.sh smoke:local

      - name: Image size
        run: |
          echo "uncompressed: $(docker image inspect smoke:local --format '{{.Size}}') bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' smoke:local | cut -c1-160 | head -20

      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'push'
        name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          for tag in $TAGS; do docker tag smoke:local "$tag"; docker push "$tag"; done
          first=$(echo "$TAGS" | head -n1)
          echo "digest: $(docker inspect --format '{{index .RepoDigests 0}}' "$first")" | tee -a "$GITHUB_STEP_SUMMARY"
          # Informational only: never fail the run after a successful push.
          size=$(docker manifest inspect -v "$first" | jq '.SchemaV2Manifest | [.config.size, .layers[].size] | add' || true)
          echo "compressed (config+layers): ${size:-unavailable} bytes" | tee -a "$GITHUB_STEP_SUMMARY"
