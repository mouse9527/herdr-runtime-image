name: image

# Weekly rebuild picks up the newest claude / codex / pi CLIs and herdr release. `latest` moves only after the smoke
# test passes; dated tags stay, so rolling back is switching to the previous date.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1' # Mondays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11' # the image's python3 (Debian bookworm)
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: No credentials in the repository
        run: SCAN_REPO=1 python3 scripts/scan_secrets.py .

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve newest herdr and CLI versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          scripts/resolve-versions.sh amd64 | tee versions.env
          {
            echo 'args<<EOF'
            cat versions.env
            echo EOF
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.versions.outputs.date }}
            type=sha,prefix=sha-
            type=raw,value=latest

      # Build amd64 into the local daemon first; push only after the smoke test passes.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smoke:local
          build-args: ${{ steps.versions.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The cluster keeps home on NFS v4.1 (hard mount); test on the same kind of mount, served by the runner.
      - name: NFS home for the smoke test
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq nfs-kernel-server >/dev/null
          sudo mkdir -p /srv/nfs/home /mnt/nfs-home
          sudo chown 10001:10001 /srv/nfs/home
          sudo chmod 0700 /srv/nfs/home
          echo '/srv/nfs/home 127.0.0.1(rw,sync,no_subtree_check,no_root_squash)' | sudo tee /etc/exports
          sudo exportfs -ra
          sudo systemctl restart nfs-kernel-server
          sudo mount -t nfs -o vers=4.1,hard,proto=tcp,timeo=600,retrans=2 127.0.0.1:/srv/nfs/home /mnt/nfs-home
          mount | grep /mnt/nfs-home

      - name: Smoke test
        env:
          SMOKE_HOME_DIR: /mnt/nfs-home
        run: scripts/smoke.sh smoke:local

      - name: Versions and size
        run: |
          {
            echo '### Installed'
            echo '```'
            docker run --rm --entrypoint cat smoke:local /opt/herdr-runtime/VERSIONS
            echo '```'
            echo "uncompressed: $(docker image inspect smoke:local --format '{{.Size}}') bytes"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' smoke:local | cut -c1-160 | head -20

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          # latest last, so it never points at an image whose other tags failed to push
          for tag in $(echo "$TAGS" | grep -v ':latest$') $(echo "$TAGS" | grep ':latest$'); do
            docker tag smoke:local "$tag"; docker push "$tag"
          done
          first=$(echo "$TAGS" | head -n1)
          echo "digest: $(docker inspect --format '{{index .RepoDigests 0}}' "$first")" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "tags: $(echo $TAGS)" | tee -a "$GITHUB_STEP_SUMMARY"
          # Informational only: never fail the run after a successful push.
          size=$(docker manifest inspect -v "$first" | jq '.SchemaV2Manifest | [.config.size, .layers[].size] | add' || true)
          echo "compressed (config+layers): ${size:-unavailable} bytes" | tee -a "$GITHUB_STEP_SUMMARY"
